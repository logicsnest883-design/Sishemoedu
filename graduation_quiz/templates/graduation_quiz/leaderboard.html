
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Leaderboard | Sishemo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white p-5">

<div class="max-w-4xl mx-auto py-8">

    <div class="text-center mb-10">
        <div class="text-5xl mb-4">🏆</div>
        <h1 class="text-3xl md:text-5xl font-black">
            LIVE LEADERBOARD
        </h1>
        <p class="text-slate-400 mt-3">
            Sishemo Graduation Quiz
        </p>
        <p id="competition-status" class="text-blue-400 mt-3 font-semibold">
            Waiting for competition
        </p>
    </div>

    <div class="bg-slate-900 rounded-2xl overflow-hidden border border-slate-800">

        <div class="grid grid-cols-12 bg-slate-800 p-4 font-bold text-slate-300">
            <div class="col-span-2">Rank</div>
            <div class="col-span-7">Participant</div>
            <div class="col-span-3 text-right">Points</div>
        </div>

        <div id="leaderboard">
            <div class="p-8 text-center text-slate-400">
                Waiting for participants...
            </div>
        </div>

    </div>

    <p class="text-center text-slate-500 mt-6">
        Scores update automatically
    </p>

</div>

<script>
const leaderboardUrl = "{% url 'graduation_quiz:leaderboard_data' %}";

async function updateLeaderboard() {
    try {
        const response = await fetch(leaderboardUrl);
        const data = await response.json();

        document.getElementById('competition-status').textContent =
            data.status === 'completed' ? 'Competition completed' :
            data.status === 'live' ? 'Competition in progress' :
            data.status === 'ready' ? 'Registration open' :
            'Waiting for competition';

        const container = document.getElementById('leaderboard');

        if (!data.participants.length) {
            container.innerHTML =
                '<div class="p-8 text-center text-slate-400">' +
                'No participants have joined yet.' +
                '</div>';
            return;
        }

        container.innerHTML = '';

        data.participants.forEach((participant, index) => {
            const row = document.createElement('div');

            row.className =
                'grid grid-cols-12 items-center p-4 border-t ' +
                'border-slate-800 ' +
                (index === 0 ? 'bg-yellow-500/10' : '');

            const rank = document.createElement('div');
            rank.className = 'col-span-2 font-black text-lg';
            rank.textContent = '#' + (index + 1);

            const name = document.createElement('div');
            name.className = 'col-span-7 font-semibold';
            name.textContent = participant.name;

            const score = document.createElement('div');
            score.className =
                'col-span-3 text-right font-bold text-blue-400';
            score.textContent = participant.score;

            row.append(rank, name, score);
            container.appendChild(row);
        });

    } catch (error) {
        document.getElementById('competition-status').textContent =
            'Reconnecting...';
    }
}

updateLeaderboard();
setInterval(updateLeaderboard, 2000);
</script>

</body>
</html>
