{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto mt-10 bg-white shadow-2xl rounded-3xl p-8">

    <!-- ===================== -->
    <!-- WEEK SELECTOR (GET)   -->
    <!-- ===================== -->
    <form method="GET" class="mb-6">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <h2 class="text-3xl font-extrabold text-gray-800 mb-4 md:mb-0">
                Class Register
            </h2>

            <div class="flex items-center space-x-2">
                <label for="week" class="font-semibold text-gray-700">
                    Select Week:
                </label>

                <select name="week" id="week"
                        onchange="this.form.submit()"
                        class="border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">

                    {% for week in weeks %}
                        <option value="{{ week }}"
                            {% if week == selected_week %}selected{% endif %}>
                            Week {{ week }}
                        </option>
                    {% endfor %}

                </select>
            </div>
        </div>
    </form>

    <!-- ===================== -->
    <!-- ATTENDANCE FORM POST  -->
    <!-- ===================== -->
    <form method="POST" id="attendance-form">
        {% csrf_token %}

        <!-- Hidden week so POST knows selected week -->
        <input type="hidden" name="week" value="{{ selected_week }}">

        <!-- Attendance Table -->
        <div class="overflow-x-auto rounded-lg shadow-md">
            <table class="min-w-full border-collapse border border-gray-200">

                <thead class="bg-blue-50">
                    <tr>
                        <th class="border p-3 text-left text-gray-700 font-semibold">Learner Name</th>
                        <th class="border p-3 text-center text-gray-700 font-semibold">Mon</th>
                        <th class="border p-3 text-center text-gray-700 font-semibold">Tue</th>
                        <th class="border p-3 text-center text-gray-700 font-semibold">Wed</th>
                        <th class="border p-3 text-center text-gray-700 font-semibold">Thu</th>
                        <th class="border p-3 text-center text-gray-700 font-semibold">Fri</th>
                        <th class="border p-3 text-center text-gray-700 font-semibold">Attendance %</th>
                    </tr>
                </thead>

                <tbody class="divide-y divide-gray-100">
                    {% for student in students %}
                    <tr class="hover:bg-blue-50 transition-colors duration-200">

                        <!-- Name -->
                        <td class="border p-3 font-medium text-gray-800">
                            {{ student.profile.user.get_full_name }}
                        </td>

                        <!-- Monday -->
                        <td class="border text-center p-2">
                            <select name="attendance_{{ student.id }}_1"
                                    class="border rounded-lg px-2 py-1">
                                <option value="">--</option>
                                <option value="P" {% if student.mon == "P" %}selected{% endif %}>✓</option>
                                <option value="A" {% if student.mon == "A" %}selected{% endif %}>✗</option>
                            </select>
                        </td>

                        <!-- Tuesday -->
                        <td class="border text-center p-2">
                            <select name="attendance_{{ student.id }}_2">
                                <option value="">--</option>
                                <option value="P" {% if student.tue == "P" %}selected{% endif %}>✓</option>
                                <option value="A" {% if student.tue == "A" %}selected{% endif %}>✗</option>
                            </select>
                        </td>

                        <!-- Wednesday -->
                        <td class="border text-center p-2">
                            <select name="attendance_{{ student.id }}_3">
                                <option value="">--</option>
                                <option value="P" {% if student.wed == "P" %}selected{% endif %}>✓</option>
                                <option value="A" {% if student.wed == "A" %}selected{% endif %}>✗</option>
                            </select>
                        </td>

                        <!-- Thursday -->
                        <td class="border text-center p-2">
                            <select name="attendance_{{ student.id }}_4">
                                <option value="">--</option>
                                <option value="P" {% if student.thu == "P" %}selected{% endif %}>✓</option>
                                <option value="A" {% if student.thu == "A" %}selected{% endif %}>✗</option>
                            </select>
                        </td>

                        <!-- Friday -->
                        <td class="border text-center p-2">
                            <select name="attendance_{{ student.id }}_5">
                                <option value="">--</option>
                                <option value="P" {% if student.fri == "P" %}selected{% endif %}>✓</option>
                                <option value="A" {% if student.fri == "A" %}selected{% endif %}>✗</option>
                            </select>
                        </td>

                        <!-- Percentage -->
                        <td class="border text-center font-bold">
                            <span class="px-2 py-1 rounded-full
                                {% if student.attendance_percentage >= 90 %}
                                    bg-green-200 text-green-800
                                {% elif student.attendance_percentage >= 75 %}
                                    bg-yellow-200 text-yellow-800
                                {% else %}
                                    bg-red-200 text-red-800
                                {% endif %}">
                                {{ student.attendance_percentage }}%
                            </span>
                        </td>

                    </tr>
                    {% endfor %}
                </tbody>

            </table>
        </div>

        <!-- Save -->
        <div class="mt-6 flex justify-end">
            <button type="submit"
                    class="bg-blue-600 text-white font-semibold px-6 py-3 rounded-xl hover:bg-blue-700 transition">
                Save Attendance
            </button>
        </div>

    </form>

</div>
{% endblock %}
