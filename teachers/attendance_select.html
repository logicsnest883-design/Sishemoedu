{% extends "base.html" %}

{% block title %}Attendance{% endblock %}

{% block content %}

<div class="min-h-screen bg-gray-50 py-10 px-4">

    <div class="max-w-xl mx-auto">

        <div class="bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">

            <div class="bg-teal-700 text-white px-6 py-7 text-center">

                <h1 class="text-2xl sm:text-3xl font-bold">
                    Attendance
                </h1>

                <p class="mt-2 text-teal-100">
                    {{ grade.name }} - Select attendance period
                </p>

            </div>

            <form method="POST" class="p-6 space-y-6">

                {% csrf_token %}

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Academic Year
                    </label>

                    <select name="year"
                            required
                            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-teal-500 focus:border-teal-500">

                        <option value="">Select Year</option>

                        {% for year in years %}
                            <option value="{{ year }}">
                                {{ year }}
                            </option>
                        {% endfor %}

                    </select>
                </div>


                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Term
                    </label>

                    <select name="term"
                            required
                            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-teal-500 focus:border-teal-500">

                        <option value="">Select Term</option>

                        {% for value, label in terms %}
                            <option value="{{ value }}">
                                {{ label }}
                            </option>
                        {% endfor %}

                    </select>
                </div>


                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Week
                    </label>

                    <select name="week"
                            required
                            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-teal-500 focus:border-teal-500">

                        <option value="">Select Week</option>

                        {% for week in weeks %}
                            <option value="{{ week }}">
                                Week {{ week }}
                            </option>
                        {% endfor %}

                    </select>
                </div>


                <button type="submit"
                        class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3.5 rounded-xl transition">

                    Continue to Class Register

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
