{% extends "base.html" %}
{% block title %}Record Payment{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-lg shadow">

    <h1 class="text-2xl font-bold text-teal-700 mb-6">
        Record Payment
    </h1>

    <p class="mb-4 text-gray-600">
        Student:
        <strong>{{ student.profile.user.get_full_name }}</strong>
    </p>

    <p class="mb-6 text-gray-600">
        Current Balance:
        <strong class="text-red-600">
            K {{ student.school_balance }}
        </strong>
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-4">
            <label class="block text-gray-700 text-sm mb-2">
                Amount Paid
            </label>
            <input type="number" step="0.01" name="amount"
                   class="w-full border rounded-lg px-3 py-2 focus:ring focus:ring-teal-200"
                   required>
        </div>

        <div class="mb-6">
            <label class="block text-gray-700 text-sm mb-2">
                Reference (Optional)
            </label>
            <input type="text" name="reference"
                   class="w-full border rounded-lg px-3 py-2 focus:ring focus:ring-teal-200">
        </div>

        <button type="submit"
                class="w-full bg-teal-600 text-white py-2 rounded-lg hover:bg-teal-700">
            Save Payment
        </button>
    </form>

</div>
{% endblock %}
