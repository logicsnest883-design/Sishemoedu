{% extends "base.html" %}
{% block title %}Teacher Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20 p-6 bg-white rounded shadow">

    <h1 class="text-2xl font-bold text-teal-700 mb-6">Teacher Login</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 px-4 py-3 rounded border-l-4
                        {% if message.tags == 'error' %}bg-red-100 text-red-800 border-red-500{% endif %}
                        {% if message.tags == 'success' %}bg-green-100 text-green-800 border-green-500{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block font-medium mb-1">Username</label>
            <input type="text" name="username" class="w-full border border-gray-300 p-2 rounded" />
        </div>
        <div>
            <label class="block font-medium mb-1">Password</label>
            <input type="password" name="password" class="w-full border border-gray-300 p-2 rounded" />
        </div>
        <button type="submit" class="w-full bg-teal-600 text-white py-2 rounded hover:bg-teal-700">
            Login
        </button>
    </form>

</div>
{% endblock %}
